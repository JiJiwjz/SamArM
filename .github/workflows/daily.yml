name: Daily Image Restoration Report

on:
  # 每天北京时间 09:00（GitHub Actions 使用 UTC，即 01:00）自动运行
  schedule:
    - cron: '0 1 * * *'
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-report:
    name: Crawl & Send Daily Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore processed-papers cache
        uses: actions/cache@v4
        with:
          path: data
          key: processed-papers-${{ github.run_id }}
          restore-keys: |
            processed-papers-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily job
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          DINGTALK_ENABLED: "false"
        run: python main.py run-once --days-back 3 --top-n 10

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_number }}
          path: out/
          retention-days: 14
