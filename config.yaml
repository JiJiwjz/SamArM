# ============ arxiv爬取配置 ============
arxiv:
  # 搜索关键词列表（仅 Image Restoration 方向）
  keywords:
    - "image restoration"
    - "image denoising"
    - "image deblurring"
    - "image deraining"
    - "image dehazing"
    - "image super-resolution"
    - "image inpainting"
    - "low-light image enhancement"

  # 搜索分类
  categories:
    - "cs.CV"        # Computer Vision
    - "eess.IV"      # Image and Video Processing
  
  # 搜索参数
  max_results: 50
  sort_by: "submittedDate"  # submittedDate|relevance|lastUpdatedDate
  sort_order: "descending"
  # 检索模式：or|and|keyword_only|category_only
  # keyword_only = 仅用上述关键词检索，避免大分类结果挤占 max_results 上限导致漏检
  search_mode: "keyword_only"

# ============ 深度学习API配置 ============
deepseek:
  api_key: "${DEEPSEEK_API_KEY}"
  api_url: "https://api.deepseek.com/v1"
  model: "deepseek-v4-flash"
  timeout: 60
  
  # 提示词配置
  system_prompt: |
    你是一个学术论文解读专家。请阅读以下论文的标题与摘要，用中文撰写一段论文解读。
    要求：
    1. 内容依次涵盖：研究背景、现有方法、现有方法的不足、研究动机（如何针对这些不足）、方法核心思路、实验结果（只描述规模最大的主实验，具体到在哪些数据集上评测以及关键指标结果）、总结。
    2. 直接写成连贯的一大段文字，不要出现“背景”“现有方法”等任何小标题，不要使用列表。
    3. 严禁使用任何 Markdown 标记符号（如 **、#、*、- 等），输出纯文本。
    4. 长度控制在 300-500 字，语言流畅、学术化。
  
  # 模型参数
  temperature: 0.7
  top_p: 0.9
  max_tokens: 500

# ============ 邮件配置 ============
email:
  # 发送者信息
  sender_email: "${SENDER_EMAIL}"
  sender_password: "${SENDER_PASSWORD}"
  
  # SMTP配置
  smtp_server: "${SMTP_SERVER}"
  smtp_port: ${SMTP_PORT}
  use_tls: true
  
  # 收件人列表
  recipients: "${RECIPIENT_EMAILS}"
  
  # 邮件设置
  subject_prefix: "【Image Restoration日报】"
  send_html: true
  include_links: true

# ============ 定时任务配置 ============
scheduler:
  # 执行时间（HH:MM格式）
  execute_time: "09:00"
  
  # 执行频率：daily|weekly|monthly
  frequency: "daily"
  
  # 星期几执行（weekly时有效）：0-6表示周一到周日
  day_of_week: 0
  
  # 是否启用调度
  enabled: true
  
  # 任务超时时间（秒）
  timeout: 300

# ============ 日志配置 ============
logging:
  level: "INFO"  # DEBUG|INFO|WARNING|ERROR|CRITICAL
  file: "logs/arxiv_mailbot.log"
  max_size_mb: 10
  backup_count: 5
  
  # 日志格式
  format: "[%(asctime)s] %(levelname)s - %(name)s - %(message)s"

# ============ 数据存储配置 ============
storage:
  # 数据目录
  data_dir: "data"
  
  # 是否保存论文PDF
  save_pdf: false
  
  # 数据格式：json|csv
  format: "json"
  
  # 是否保存中间结果
  save_intermediate: true

# ============ 爬虫配置 ============
crawler:
  # 请求超时时间（秒）
  timeout: 30
  
  # 重试次数
  max_retries: 3
  
  # 重试延迟（秒）
  retry_delay: 5
  
  # 请求头User-Agent
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  
  # 使用代理
  use_proxy: false
  proxy_url: "${HTTP_PROXY}"

# ============ 过滤配置 ============
filter:
  # 论文最小相关性分数（0-1）
  min_relevance_score: 0.5
  
  # 是否去重
  deduplicate: true
  
  # 是否过滤已处理论文
  skip_processed: true
